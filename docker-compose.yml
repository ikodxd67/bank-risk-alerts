services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: bra-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      SRC_PASSWORD: ${SRC_PASSWORD}
      DWH_PASSWORD: ${DWH_PASSWORD}
    volumes:
      - oradata:/opt/oracle/oradata
      # скрипты отрабатывают один раз, при первом создании базы
      - ./docker/oracle/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60

  # Метаданные Airflow (запуски, состояния задач). Не путать с хранилищем — оно в Oracle.
  airflow-db:
    image: postgres:17-alpine
    container_name: bra-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 20

  # shortcut: один контейнер `airflow standalone` (api-server, scheduler, dag-processor,
  # triggerer в одном процессе) — экономит память стенда; в проде это отдельные сервисы.
  airflow:
    build: docker/airflow
    image: bra-airflow:3.4.0
    container_name: bra-airflow
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # локальный стенд без входа: все — админы. Только для своей машины.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      AIRFLOW_CONN_ORACLE_DWH: >-
        {"conn_type": "oracle", "host": "oracle", "port": 1521, "login": "dwh",
         "password": "${DWH_PASSWORD}", "extra": {"service_name": "FREEPDB1"}}
      # стенд: root без пароля, как в образе allin1; в проде — отдельный пользователь с паролем
      AIRFLOW_CONN_STARROCKS: >-
        {"conn_type": "mysql", "host": "starrocks", "port": 9030, "login": "root", "password": ""}
      AIRFLOW_CONN_TELEGRAM_DEFAULT: >-
        {"conn_type": "telegram", "password": "${TG_BOT_TOKEN}", "host": "${TG_CHAT_ID}"}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./sql/starrocks:/opt/airflow/sql/starrocks:ro
      - airflow-logs:/opt/airflow/logs
    depends_on:
      oracle:
        condition: service_healthy
      airflow-db:
        condition: service_healthy

  # Витрины под дашборды. FE + BE в одном контейнере — только для стенда.
  # Профиль bi: тяжёлый (просит 4 ГБ), поднимается отдельно: docker compose --profile bi up -d
  starrocks:
    image: starrocks/allin1-ubuntu:4.1.7
    container_name: bra-starrocks
    profiles: ["bi"]
    ports:
      - "9030:9030"   # SQL по протоколу MySQL
      - "8030:8030"   # веб-интерфейс FE
    volumes:
      - sr-meta:/data/deploy/starrocks/fe/meta
      - sr-storage:/data/deploy/starrocks/be/storage
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9030 -uroot -e 'SHOW BACKENDS' | grep -q true"]
      interval: 10s
      timeout: 5s
      retries: 60

volumes:
  sr-meta:
  sr-storage:
  oradata:
  airflow-db:
  airflow-logs:
