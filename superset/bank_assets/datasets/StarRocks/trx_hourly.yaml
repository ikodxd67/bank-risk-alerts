table_name: trx_hourly
schema: bank
main_dttm_col: trx_date
uuid: 0b0b0b0b-0000-4000-8000-000000000012
database_uuid: 0b0b0b0b-0000-4000-8000-000000000001
version: 1.0.0
metrics:
# битовая карта: точное число разных карт за любой период (дневные числа складывать нельзя)
- {metric_name: distinct_cards, verbose_name: Distinct cards, expression: BITMAP_UNION_COUNT(cards)}
- {metric_name: trx_cnt, verbose_name: Transactions, expression: SUM(trx_cnt)}
columns:
- {column_name: trx_date, type: DATE, is_dttm: true, is_active: true, groupby: true, filterable: true}
- {column_name: trx_hour, type: TINYINT, is_dttm: false, is_active: true, groupby: true, filterable: true}
- {column_name: channel, type: VARCHAR, is_dttm: false, is_active: true, groupby: true, filterable: true}
- {column_name: is_foreign, type: VARCHAR, is_dttm: false, is_active: true, groupby: true, filterable: true}
